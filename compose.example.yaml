services:
  warp:
    image: ghcr.io/xstrace/warp-sidecar:latest
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WARP_TUNNEL_PROTOCOL: MASQUE
      WARP_MODE: warp+doh
    volumes:
      - warp-state:/var/lib/cloudflare-warp
    restart: unless-stopped
    # Publish an application port from the shared network namespace here:
    # ports:
    #   - "127.0.0.1:8080:8080"

  app:
    image: curlimages/curl:latest
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    network_mode: service:warp
    depends_on:
      warp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  warp-state:
